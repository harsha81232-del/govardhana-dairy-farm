<div id="upiPaymentSection">

  <h3>Pay with UPI</h3>

  <input
    type="number"
    id="upiAmount"
    min="1"
    step="0.01"
    placeholder="Enter amount"
  >

  <button type="button" id="payNowBtn">
    Pay with UPI
  </button>

  <p id="upiMessage"></p>

  <img
    id="upiQrCodeImg"
    width="200"
    height="200"
    alt="UPI QR Code"
  >

</div>

<script>
const MERCHANT_UPI_ID = "8867011865@ptyes";
const MERCHANT_NAME = "Govardhana Dairy Farms";

const amountInput = document.getElementById("upiAmount");
const payButton = document.getElementById("payNowBtn");
const message = document.getElementById("upiMessage");
const qr = document.getElementById("upiQrCodeImg");

function makeUPILink() {
    const amount = amountInput.value.trim();

    if (!amount || Number(amount) <= 0) {
        return null;
    }

    return "upi://pay?pa=" +
        encodeURIComponent(MERCHANT_UPI_ID) +
        "&pn=" +
        encodeURIComponent(MERCHANT_NAME) +
        "&am=" +
        encodeURIComponent(Number(amount).toFixed(2)) +
        "&cu=INR";
}

payButton.addEventListener("click", function () {

    const upiLink = makeUPILink();

    if (!upiLink) {
        message.innerText = "Please enter a valid amount.";
        return;
    }

    message.innerText = "Opening UPI...";

    window.location.href = upiLink;
});

amountInput.addEventListener("input", function () {

    const upiLink = makeUPILink();

    if (upiLink) {
        qr.src =
            "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
            encodeURIComponent(upiLink);

        message.innerText = "";
    }
});
</script>
